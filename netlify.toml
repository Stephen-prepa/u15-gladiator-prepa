# z72 — Protection du site : on ne publie que ce dont l'appli a besoin.
# Les fichiers de travail (carnet du projet, instructions, code serveur, anciens doublons) ne sont plus servis.
[[redirects]]
  from = "/serveur/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/LISEZ-MOI.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/LICENSE"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/style.css"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/00-version.js"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/05-espace-coachs.js"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/22-questions-joueurs.js"
  to = "/404.html"
  status = 404
  force = true

# Pas d'indexation par les moteurs de recherche, pas d'affichage dans un cadre d'un autre site
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
